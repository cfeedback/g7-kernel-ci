name: Build LG G7 Kernel with Baka-SU & NoMount (LineageOS 23.2)

on:
  workflow_dispatch: # Manual build trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libssl-dev libcrypto++-dev \
            bison flex rsync zip unzip git wget openjdk-11-jdk libncurses5-dev \
            python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache

      #- name: Restore Kernel Compilation Cache
      #  id: cache-ccache-restore
      #  uses: actions/cache/restore@v4
      #  with:
      #   path: ~/.cache/ccache
      #   key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
      #   restore-keys: |
      #     ${{ runner.os }}-kernel-ccache-

      - name: Fetch Proton-Clang Toolchain
        uses: actions/checkout@v4
        with:
          repository: 'kdrag0n/proton-clang'
          ref: 'master'
          path: 'toolchain/clang'
          fetch-depth: 1

      - name: Fetch mirukurusan Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'mirukurusan/android_kernel_lge_sdm845'
          ref: 'lineage-23.2'
          path: 'kernel-source'
          fetch-depth: 1

      - name: Inject Baka-SU Core
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          URL_SUB="raw.github"
          URL_DOM="usercontent.com"
          FULL_URL="https://${URL_SUB}${URL_DOM}/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh"
          curl -LSs "$FULL_URL" | bash -s main

      - name: Patch NoMount Subsystem
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          URL_SUB="raw.github"
          URL_DOM="usercontent.com"
          FULL_URL="https://${URL_SUB}${URL_DOM}/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh"
          curl -LSs "$FULL_URL" | bash -s dev

      - name: Inject Configuration Defconfig Flags
        run: |
          DEFCONFIG_FILE="$GITHUB_WORKSPACE/kernel-source/arch/arm64/configs/judyln_defconfig"
          
          # Baka-SU core configuration parameters
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_DEBUG=n" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_USE_SYSCALL_HOOK_COMPAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_USE_COMPAT_SYSCALL=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG_FILE
          
          # NoMount VFS mechanics and cryptographic key dependencies
          echo "CONFIG_NOMOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KEYS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_ENCRYPTED_KEYS=y" >> $DEFCONFIG_FILE

      - name: Advanced Source Patching
        run: |
          HALL_DRIVER="$GITHUB_WORKSPACE/kernel-source/drivers/input/keyboard/hall_ic.c"
          SCHED_HEADER="$GITHUB_WORKSPACE/kernel-source/kernel/sched/sched.h"
          PROC_CMDLINE="$GITHUB_WORKSPACE/kernel-source/fs/proc/cmdline.c"
          BAKASU_CHECK="$GITHUB_WORKSPACE/kernel-source/KernelSU/kernel/tools/static_export_check.mk"
          RESUKISU_KBUILD="$GITHUB_WORKSPACE/kernel-source/drivers/kernelsu/Kbuild"
          BPF_HEADER="$GITHUB_WORKSPACE/kernel-source/include/linux/bpf.h"
          
          # 1. Broadly target and patch out the legacy duplicate fallback functions in bpf.h
          sed -i '/__bpf_prog_charge/,/}/ s/^/\/\//' "$BPF_HEADER"
          sed -i '/__bpf_prog_uncharge/,/}/ s/^/\/\//' "$BPF_HEADER"

          # 2. Fix missing MKDEV macro types chain parameters
          sed -i '1s/^/#include <linux\/compiler.h>\n#include <linux\/types.h>\n#include <linux\/kdev_t.h>\n/' "$HALL_DRIVER"

          # 3. Bypass tracepoint NR_CPUS threshold block assert inside fork layouts
          sed -i 's/#error "Unsupported NR_CPUS for lb tracepoint."/\/\/ #error "Unsupported NR_CPUS for lb tracepoint."/g' "$GITHUB_WORKSPACE/kernel-source/include/trace/events/sched.h"

          # 4. Handle idle load-balancing macros for scheduler subsystems
          sed -i '1s/^/#define NOHZ_BALANCE_KICK 0\n#define NOHZ_KICK_ANY 0\nstatic inline void mark_reserved(int cpu) {}\nstatic inline long *nohz_flags(int cpu) { return 0; }\n/' "$SCHED_HEADER"

          # 5. Supply arm64 hardware layout constants straight to process metrics
          sed -i 's/#include <linux\/proc_fs.h>/#include <linux\/proc_fs.h>\n#include <asm\/setup.h>/g' "$PROC_CMDLINE"

          # 6. Drop tracepoint verification traps out of driver trees
          if [ -f "$RESUKISU_KBUILD" ]; then
            sed -i 's/\$(error TP hooks are incompatible/\# \$(error TP hooks are incompatible/g' "$RESUKISU_KBUILD"
            sed -i 's/CONFIG_KSU_USE_SYSCALL_HOOK_COMPAT=n/CONFIG_KSU_USE_SYSCALL_HOOK_COMPAT=y/g' "$RESUKISU_KBUILD"
          fi

          # 7. Apply manual VFS hook patch utilizing exact raw asset endpoint structure
          cd $GITHUB_WORKSPACE/kernel-source
          URL_SUB="raw.github"
          URL_DOM="usercontent.com"
          PATCH_URL="https://${URL_SUB}${URL_DOM}/ReSukiSU/ReSukiSU_Patches/refs/heads/main/scope-minimized/kernel-4.9.patch"
          wget "$PATCH_URL" -O kernel-4.9.patch
          git apply kernel-4.9.patch

          # 8. Clear BakaSU static verification blocks completely
          if [ -f "$BAKASU_CHECK" ]; then
            echo "all:" > "$BAKASU_CHECK"
            echo "	@echo 'Bypassed BakaSU integration rule checks safely.'" >> "$BAKASU_CHECK"
          fi

          # 9. Clear out any previous problematic macro replacements in kernel_compat.h
          KSU_COMPAT="$GITHUB_WORKSPACE/kernel-source/drivers/kernelsu/compat/kernel_compat.h"
          if [ -f "$KSU_COMPAT" ]; then
            sed -i 's/inode->i_security/selinux_inode(inode)/g' "$KSU_COMPAT"
            sed -i 's/cred->security/selinux_cred(cred)/g' "$KSU_COMPAT"
          fi

          # 10. CRUCIAL BULLETPROOF FIX: Pre-generate output folder pathways and symlink them directly!
          # This forces flask.h to reside natively within the expected source mapping fields, completely immune to out-of-tree script filtering bugs
          mkdir -p $GITHUB_WORKSPACE/kernel-source/out/security/selinux
          ln -sf $GITHUB_WORKSPACE/kernel-source/out/security/selinux $GITHUB_WORKSPACE/kernel-source/security/selinux/include

      - name: Setup AnyKernel3 Flasher
        uses: actions/checkout@v4
        with:
          repository: 'osm0sis/AnyKernel3'
          ref: 'master'
          path: 'AnyKernel3'
          fetch-depth: 1

      - name: Configure AnyKernel3 Properties
        run: |
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh
          sed -i 's/device.name1=/device.name1=judyln/g' $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh

      - name: Build Unified Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          mkdir -p out
          
          export CCACHE_DIR=~/.cache/ccache
          ccache -M 5G 
          ccache -z    
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          export CROSS_COMPILE="ccache aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="ccache arm-linux-gnueabi-"
          export CC="ccache $GITHUB_WORKSPACE/toolchain/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export HOSTCC="ccache gcc"
          export HOSTCXX="ccache g++"

          make O=out judyln_defconfig

          # Force kallsyms map export variables onto active binary configuration layout
          scripts/config --file out/.config --enable CONFIG_KALLSYMS
          scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          
          # Force enable secure computing macros to populate task structural fields
          scripts/config --file out/.config --enable CONFIG_SECCOMP
          scripts/config --file out/.config --enable CONFIG_SECCOMP_FILTER
          
          make O=out olddefconfig

          make -j$(nproc --all) O=out HOSTCC="ccache gcc" HOSTCXX="ccache g++"
          ccache -s

      - name: Package Kernel via AnyKernel3
        run: |
          IMAGE_PATH="$GITHUB_WORKSPACE/kernel-source/out/arch/arm64/boot/Image.gz-dtb"
          if [ -f "$IMAGE_PATH" ]; then
            cp "$IMAGE_PATH" $GITHUB_WORKSPACE/AnyKernel3/
          else
            cp $GITHUB_WORKSPACE/kernel-source/out/arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/AnyKernel3/
          fi
          
          cd $GITHUB_WORKSPACE/AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/G7-Lineage23.2-NoMount.zip * -x .git README.md

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: LG-G7-NoMount-Kernel
          path: ${{ github.workspace }}/G7-Lineage23.2-NoMount.zip

      #- name: Always Save Kernel Compilation Cache
      #  uses: actions/cache/save@v4
      #  if: always() && steps.cache-ccache-restore.outputs.cache-hit != 'true'
      #  with:
      #    path: ~/.cache/ccache
      #    key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
