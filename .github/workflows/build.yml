name: Build LG G7 Kernel with ReSukiSU & NoMount (LineageOS 23.2)

on:
  workflow_dispatch: # Manual build trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libssl-dev libcrypto++-dev \
            bison flex rsync zip unzip git wget openjdk-11-jdk libncurses5-dev \
            python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache

      # Crucial: This stores and restores your compiled object files between runs
      - name: Setup Kernel Compilation Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-
            
      - name: Fetch Proton-Clang Toolchain
        uses: actions/checkout@v4
        with:
          repository: 'kdrag0n/proton-clang'
          ref: 'master'
          path: 'toolchain/clang'
          fetch-depth: 1

      - name: Fetch mirukurusan Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'mirukurusan/android_kernel_lge_sdm845'
          ref: 'lineage-23.2'
          path: 'kernel-source'
          fetch-depth: 1

      - name: Inject ReSukiSU Core
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

      - name: Patch NoMount Subsystem
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s dev

      - name: Inject Configuration Defconfig Flags
        run: |
          DEFCONFIG_FILE="$GITHUB_WORKSPACE/kernel-source/arch/arm64/configs/judyln_defconfig"
          
          # ReSukiSU core flags
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_DEBUG=n" >> $DEFCONFIG_FILE
          
          # Force export all kernel symbols for ReSukiSU/SELinux hooking
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG_FILE
          
          # NoMount core hardware/VFS patches & cryptographic keys dependencies
          echo "CONFIG_NOMOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KEYS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_ENCRYPTED_KEYS=y" >> $DEFCONFIG_FILE

      - name: Advanced Source Patching
        run: |
          # Define file path structures
          BPF_HEADER="$GITHUB_WORKSPACE/kernel-source/include/linux/bpf.h"
          HALL_DRIVER="$GITHUB_WORKSPACE/kernel-source/drivers/input/keyboard/hall_ic.c"
          SCHED_CORE="$GITHUB_WORKSPACE/kernel-source/kernel/sched/core.c"
          PROC_CMDLINE="$GITHUB_WORKSPACE/kernel-source/fs/proc/cmdline.c"
          
          # 1. Cleanly comment out duplicate BPF fallback signatures
          sed -i '/static inline int __bpf_prog_charge/,/}/ s/^/\/\//' "$BPF_HEADER"
          sed -i '/static inline void __bpf_prog_uncharge/,/}/ s/^/\/\//' "$BPF_HEADER"

          # 2. Fix missing MKDEV sensory wake-up macro by adding its header
          sed -i '1s/^/#include <linux\/kdev_t.h>\n/' "$HALL_DRIVER"

          # 3. Bypass ReSukiSU's shallow clone assert check rule safely
          sed -i 's/\$(error You should integrate ReSukiSU in your kernel.)/\$(info Bypassed ReSukiSU check)/g' "$GITHUB_WORKSPACE/kernel-source/KernelSU/kernel/tools/static_export_check.mk"

          # 4. Prevent the tracepoint NR_CPUS error assert from breaking fork layouts
          sed -i 's/#error "Unsupported NR_CPUS for lb tracepoint."/\/\/ #error "Unsupported NR_CPUS for lb tracepoint."/g' "$GITHUB_WORKSPACE/kernel-source/include/trace/events/sched.h"

          # 5. Fix NOHZ_BALANCE_KICK by explicitly ensuring the scheduler metrics header is imported
          sed -i '1s/^/#include "sched.h"\n/' "$SCHED_CORE"

          # 6. Fix COMMAND_LINE_SIZE undeclared error by injecting the arm64 architecture setup rules
          sed -i '1s/^/#include <asm\/setup.h>\n/' "$PROC_CMDLINE"

      - name: Setup AnyKernel3 Flasher
        uses: actions/checkout@v4
        with:
          repository: 'osm0sis/AnyKernel3'
          ref: 'master'
          path: 'AnyKernel3'
          fetch-depth: 1

      - name: Configure AnyKernel3 Properties
        run: |
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh
          sed -i 's/device.name1=/device.name1=judyln/g' $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh

      - name: Build Unified Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          
          # Clean output target structures
          mkdir -p out

          # Initialize ccache layout properties
          export CCACHE_DIR=~/.cache/ccache
          ccache -M 5G # Restrict compiler storage size ceiling to 5GB max
          ccache -z    # Reset internal tracking hits statistics log
          
          # Define fundamental targets
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Pipe the execution calls directly through ccache binaries wrappers
          export CROSS_COMPILE="ccache aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="ccache arm-linux-gnueabi-"
          export CC="ccache $GITHUB_WORKSPACE/toolchain/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export HOSTCC="ccache gcc"
          export HOSTCXX="ccache g++"

          # Initialize custom defconfig structure
          make O=out judyln_defconfig

          # Compile using cached thread paths
          make -j$(nproc --all) O=out HOSTCC="ccache gcc" HOSTCXX="ccache g++"
          
          # Output cache utilization results to tracking charts
          ccache -s

      - name: Package Kernel via AnyKernel3
        run: |
          IMAGE_PATH="$GITHUB_WORKSPACE/kernel-source/out/arch/arm64/boot/Image.gz-dtb"
          if [ -f "$IMAGE_PATH" ]; then
            cp "$IMAGE_PATH" $GITHUB_WORKSPACE/AnyKernel3/
          else
            cp $GITHUB_WORKSPACE/kernel-source/out/arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/AnyKernel3/
          fi
          
          cd $GITHUB_WORKSPACE/AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/G7-Lineage22-NoMount.zip * -x .git README.md

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: LG-G7-NoMount-Kernel
          path: ${{ github.workspace }}/G7-Lineage23.2-ReSukiSu-NoMount.zip
