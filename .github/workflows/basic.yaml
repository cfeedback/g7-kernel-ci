name: Build LG G7 Kernel (LineageOS 23.2)

on:
  workflow_dispatch: # Manual build trigger

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libssl-dev libcrypto++-dev \
            bison flex rsync zip unzip git wget openjdk-11-jdk libncurses5-dev \
            python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-10 g++-10

      - name: Fetch ZyCromerZ SDClang 12 Toolchain
        uses: actions/checkout@v4
        with:
          repository: 'ZyCromerZ/SDClang'
          ref: '12'
          path: 'toolchain/clang'
          fetch-depth: 1

      - name: Fetch mirukurusan Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'mirukurusan/android_kernel_lge_sdm845'
          ref: 'lineage-23.2'
          path: 'kernel-source'
          fetch-depth: 1

      - name: Advanced Source Patching
        run: |
          BPF_CORE="$GITHUB_WORKSPACE/kernel-source/kernel/bpf/core.c"
          PROC_CMDLINE="$GITHUB_WORKSPACE/kernel-source/fs/proc/cmdline.c"
          
          # 1. FOOLPROOF FIX: Inject an inline, localized scoped variable declaration right before the bpf_load_pointer statement evaluates
          if [ -f "$BPF_CORE" ]; then
            sed -i 's/ptr = bpf_load_pointer/u32 tmp; ptr = bpf_load_pointer/g' "$BPF_CORE"
            
            # 2. Add an explicit cast to macro assignments to clear structural pointer mismatch errors
            sed -i 's/#define PROG_NAME_LIST(stack_size) PROG_NAME(stack_size),/#define PROG_NAME_LIST(stack_size) (void *)PROG_NAME(stack_size),/g' "$BPF_CORE"
          fi

          # 3. Supply arm64 setup constants to proc filesystem metrics to fix COMMAND_LINE_SIZE
          if [ -f "$PROC_CMDLINE" ]; then
            sed -i 's/#include <linux\/proc_fs.h>/#include <linux\/proc_fs.h>\n#include <asm\/setup.h>/g' "$PROC_CMDLINE"
          fi

      - name: Setup AnyKernel3 Flasher
        uses: actions/checkout@v4
        with:
          repository: 'osm0sis/AnyKernel3'
          ref: 'master'
          path: 'AnyKernel3'
          fetch-depth: 1

      - name: Configure AnyKernel3 Properties
        run: |
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh
          sed -i 's/device.name1=/device.name1=judyln/g' $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh

      - name: Build Unified Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          mkdir -p out
          
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Force the host compiler to utilize GCC 10 blocks to align with the 4.9 scripting subsystems
          export HOSTCC=gcc-10
          export HOSTCXX=g++-10
          
          # Initialize the master configuration profile template on disk
          make O=out sdm845-perf_defconfig
          
          # Configure tracking symbols safely
          scripts/config --file out/.config --enable KALLSYMS
          scripts/config --file out/.config --enable KALLSYMS_ALL
          scripts/config --file out/.config --enable SECCOMP
          scripts/config --file out/.config --enable CONFIG_SECCOMP_FILTER
          
          # Process changes and re-balance variables
          make O=out olddefconfig
          
          # Print confirmation entries in your dashboard log stream
          grep -E '^(CONFIG_KALLSYMS|CONFIG_SECCOMP)=' out/.config || true
          
          # Pre-populate automated system headers
          make O=out prepare
          
          # Execute parallel compilation using synchronized host and cross tools
          make -j$(nproc --all) O=out HOSTCC=gcc-10 HOSTCXX=g++-10 Image.gz-dtb

      - name: Package Kernel via AnyKernel3
        run: |
          IMAGE_PATH="$GITHUB_WORKSPACE/kernel-source/out/arch/arm64/boot/Image.gz-dtb"
          if [ -f "$IMAGE_PATH" ]; then
            cp "$IMAGE_PATH" $GITHUB_WORKSPACE/AnyKernel3/
          else
            cp $GITHUB_WORKSPACE/kernel-source/out/arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/AnyKernel3/
          fi
          
          cd $GITHUB_WORKSPACE/AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/G7-Lineage23.2.zip * -x .git README.md

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: LG-G7-Stock-Kernel
          path: ${{ github.workspace }}/G7-Lineage23.2.zip
